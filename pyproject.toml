
[project]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Agente inteligente académico desarrollado con Google ADK"
authors = [
    {name = "Ismael Quispe", email = "ismael.quispe.ruiz@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "agente_ucv" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
